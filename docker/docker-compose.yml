# NEXUS — локальный и production-стенд одной командой:
#   docker compose -f docker/docker-compose.yml up -d --build
name: nexus

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Миграции применяются отдельным one-shot контейнером до старта приложения
  migrate:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@postgres:5432/${POSTGRES_DB:-nexus}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'

  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@postgres:5432/${POSTGRES_DB:-nexus}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${PORT:-4000}:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      API_URL: http://server:4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@postgres:5432/${POSTGRES_DB:-nexus}?schema=public
    depends_on:
      server:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        # Пустое значение = фронт ходит на тот же origin через nginx-прокси
        VITE_API_URL: ''
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  postgres-data:
